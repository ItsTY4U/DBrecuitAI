{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile|DBRecruitAI</title>
    <link rel="stylesheet" href="{% static "css/account.css" %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="landing-page">
        <header class="navbar glass">
            <div class="nav-logo">
                <img src="{% static 'images/logo.png'%}" alt="DBRecruitAI Logo">
            </div>
            <nav class="nav-menu">
                <a href="{% url "home" %}" class="nav-link">Home</a>
                <a href="{% url 'jobs' %}" class="nav-link">Jobs</a>
                {% if user.is_authenticated and not user.is_staff %}
                <a href="{% url "profile" %}" class="nav-link">Profile</a>
                <a href="{% url "applicant_logout" %}" class="nav-link">Logout</a>
                {% else %}
                <a href="{% url "applicant_login" %}" class="nav-link">Login</a>
                <a href="{% url "signup" %}" class="nav-link">Sign Up</a>
                {% endif %}
            </nav>
        </header>

        {% block content %}
        {% endblock %}

        <footer class="landing-footer glass">
            
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous">
    </script>
    <script src="{% static "js/signup.js" %}"></script>
</body>
</html>

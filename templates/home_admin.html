{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard | DBRecruitAI</title>

    <!-- Preconnect & DNS-Prefetch for external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <!-- Preload Critical CSS -->
    <link rel="preload" href="{% static "css/style.css" %}" as="style">
    <link rel="stylesheet" href="{% static "css/style.css" %}">

    <!-- Non-render-blocking Web Fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
    </noscript>

    <!-- Non-render-blocking FontAwesome -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </noscript>
</head>
<body class="dashboard-body light-bg">
    <div class="bg-container dim"></div>
    <div class="dashboard-container" id="admin-root">
        <!-- Sidebar -->
        <aside class="sidebar" hx-boost="true" hx-select="#admin-root" hx-target="#admin-root" hx-swap="outerHTML show:top">
            <div class="sidebar-logo">
                <a href="{% url 'dashboard' %}">
                    <img src="{% static "images/logo.png" %}" alt="DBRecruitAI" width="140" height="40">
                </a>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <a href="{% url "dashboard" %}" class="nav-link menu-link"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a>
                </li>
                <li class="menu-item {% if request.resolver_match.url_name == 'job_management' or request.resolver_match.url_name == 'manage_job' %}active{% endif %}">
                    <a href="{% url "job_management" %}" class="nav-link menu-link"><i class="fas fa-briefcase"></i> <span>Manage Jobs</span></a>
                </li>
                <li class="menu-item {% if request.resolver_match.url_name == 'candidates' or request.resolver_match.url_name == 'candidate_department' or request.resolver_match.url_name == 'candidate_detail' %} active {% endif %}" >
                    <a href="{% url "candidates" %}" class="nav-link menu-link"><i class="fas fa-user-group"></i> <span>Candidates</span></a>
                </li>
                <li class="menu-item {% if request.resolver_match.url_name == 'interviews' or request.resolver_match.url_name == 'schedule_interview' or request.resolver_match.url_name == 'interview_detail' %}active{% endif %}">
                    <a href="{% url "interviews" %}" class="nav-link menu-link"><i class="fas fa-calendar-check"></i> <span>Interviews</span></a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <ul class="sidebar-footer-menu">
                    <li class="menu-item">
                        <a href="{% url "hr_logout" %}" class="menu-link-logout" hx-boost="false">
                            <i class="fas fa-arrow-right-from-bracket"></i>
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>
        {% block admin_body %}
        
        {% endblock %}
    </div>
    <script src="{% static "js/modal.js" %}"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</body>
</html>

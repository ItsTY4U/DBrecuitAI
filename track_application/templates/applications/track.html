{% extends "home.html" %}
{% load static %}
{% block body %}
<div class="bg-container dim"></div>
<main class="main-content-centered">
    <div class="content-header text-center">
        <h1 class="page-title">Track Application</h1>
        <p class="page-subtitle">
            Enter your unique application ID to see your current status.
        </p>
    </div>
    <div class="track-container glass-white">
            <form class="search-box" hx-get="{% url 'track_application' %}"
                hx-target="#track-result-container" hx-swap="innerHTML" >
                <input
                    type="text"
                    name="application_id"
                    placeholder="Enter Application ID">
                <div class="back-button-container">
                    <a href="{% url 'home' %}" class="btn btn-outline-alt">
                        <i class="fas fa-arrow-left"></i> Back
                    </a>
                </div>
                <button type="submit"  class="btn btn-primary btn-track" >
                    Track Status
                </button>

            </form>
    </div>
    <div id="track-result-container"></div>
</main>

<!-- Supabase JS Client for Realtime Updates -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
{% endblock %}

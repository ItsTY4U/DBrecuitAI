services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbrecruitai-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app:delegated
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Optional local PostgreSQL container (for testing without remote Supabase)
  # Run with: docker compose --profile local-db up
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: dbrecruitai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dbrecruitai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dbrecruitai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
  static_data:
services:
  web:
    build: .
    container_name: dbrecruitai-web

    command: []

    volumes:
      - .:/app:delegated
      - media_data:/app/media
      - static_data:/app/staticfiles

    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

  database:
    image: mysql:8.4
    container_name: dbrecruitai-database

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  media_data:
  static_data: